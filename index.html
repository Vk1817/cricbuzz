</head>

<!-- LOADING -->

<div id="loading">

    <div class="spinner"></div>

    <div style="color:#666;font-size:13px;">

    </div>

</div>


<!-- HOME -->

<div id="home">

    <header id="header">

        <h1>
            CRICKCAST · Live
        </h1>

    </header>


    <div id="status">
        Loading...
    </div>


    <div id="ch-grid"></div>

</div>


<!-- PLAYER -->

<div id="player-page">

    <div id="video-container">

        <button id="back">
            ←
        </button>

        <div id="player-title"></div>

        <video
            id="video"
            playsinline
            controls>
        </video>


        <div id="player-message">

            <h2>
                Playback unavailable
            </h2>

            <p id="player-message-text">
                Unable to play this stream.
            </p>

        </div>

    </div>

</div>


<!-- SHAKA -->

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>


<script>

"use strict";


/* ==================================================
   CONFIG
================================================== */

const API =
    "https://raw.githubusercontent.com/Vk1817/cricbuzz/main/willow.json";


/* ==================================================
   ELEMENTS
================================================== */

const loading =
    document.getElementById("loading");

const grid =
    document.getElementById("ch-grid");

const status =
    document.getElementById("status");

const home =
    document.getElementById("home");

const playerPage =
    document.getElementById("player-page");

const video =
    document.getElementById("video");

const playerTitle =
    document.getElementById("player-title");

const playerMessage =
    document.getElementById("player-message");

const playerMessageText =
    document.getElementById(
        "player-message-text"
    );

const back =
    document.getElementById("back");


let currentPlayer = null;


/* ==================================================
   FETCH JSON
================================================== */

async function loadData() {

    const response =
        await fetch(
            API + "?t=" + Date.now(),
            {
                cache: "no-store",
                headers: {
                    "Accept":
                        "application/json"
                }
            }
        );


    if (!response.ok) {

        throw new Error(
            "HTTP " +
            response.status
        );

    }


    return await response.json();

}


/* ==================================================
   STREAM URL EXTRACTION
==================================================

   IMPORTANT:

   stream_url_alpha and stream_url_bravo
   in your JSON are OBJECTS.

   Example:

   stream_url_alpha: {
       "Fistly Server": "...",
       "Amazon Server": "...",
       "Akamai Server": "...",
       ...
   }

================================================== */

function getStreamUrl(match) {

    const groups = [

        /*
            Bravo first
        */

        match.stream_url_bravo,

        /*
            Alpha fallback
        */

        match.stream_url_alpha

    ];


    /*
        Preferred server order
    */

    const preferredServers = [

        "Akamai Server",

        "Amazon Server",

        "Cloudfront Server 1",

        "Cloudfront Server 2",

        "Amazon Server",

        "Fistly Server"

    ];


    /*
        Search groups
    */

    for (
        const group
        of groups
    ) {

        if (!group) {
            continue;
        }


        /*
            If group is already
            a string
        */

        if (
            typeof group ===
            "string"
        ) {

            const url =
                group.trim();


            if (url) {

                return url;

            }

        }


        /*
            If group is an object
        */

        if (
            typeof group ===
            "object"
        ) {


            /*
                Preferred servers
            */

            for (
                const server
                of preferredServers
            ) {

                const url =
                    group[server];


                if (
                    typeof url ===
                    "string" &&
                    url.trim()
                ) {

                    return url.trim();

                }

            }


            /*
                Generic fallback
            */

            for (
                const url
                of Object.values(group)
            ) {

                if (
                    typeof url ===
                    "string" &&
                    url.trim()
                ) {

                    return url.trim();

                }

            }

        }

    }


    return "";

}


/* ==================================================
   CREATE CARD
================================================== */

function createCard(match) {

    const card =
        document.createElement("a");


    card.className =
        "ch-card";


    card.href =
        "?id=" +
        encodeURIComponent(
            match.match_id
        );


    /*
        IMAGE
    */

    const image =
        document.createElement("img");


    image.className =
        "ch-logo";


    image.src =
        match.cover_image ||
        "";


    image.alt =
        match.title ||
        "Cricket";


    image.loading =
        "lazy";


    image.onerror =
        function() {

            this.style.display =
                "none";

        };


    card.appendChild(
        image
    );


    /*
        TITLE
    */

    const title =
        document.createElement("span");


    title.className =
        "ch-name";


    title.textContent =
        match.title ||
        "Live Cricket Match";


    card.appendChild(
        title
    );


    /*
        BADGE
    */

    const badge =
        document.createElement("span");


    badge.className =
        "ch-badge";


    if (
        String(match.status)
            .toUpperCase() ===
        "LIVE"
    ) {

        badge.textContent =
            "● LIVE";


        badge.style.color =
            "#ef4444";


        badge.style.border =
            "1px solid #ef4444";

    }

    else {

        badge.textContent =
            match.time ||
            "UPCOMING";

    }


    card.appendChild(
        badge
    );


    return card;

}


/* ==================================================
   RENDER
================================================== */

function renderMatches(data) {

    const matches =
        Array.isArray(data.Matches)
            ? data.Matches
            : [];


    grid.innerHTML =
        "";


    if (!matches.length) {

        grid.innerHTML = `
            <div class="empty">
                No cricket matches found.
            </div>
        `;


        status.textContent =
            "No matches available.";


        return;

    }


    /*
        LIVE FIRST
    */

    matches.sort(
        function(a, b) {

            const aLive =
                String(a.status)
                    .toUpperCase() ===
                "LIVE";

            const bLive =
                String(b.status)
                    .toUpperCase() ===
                "LIVE";


            return bLive - aLive;

        }
    );


    matches.forEach(
        function(match) {

            grid.appendChild(
                createCard(match)
            );

        }
    );


    const liveCount =
        matches.filter(
            m =>
                String(m.status)
                    .toUpperCase() ===
                "LIVE"
        ).length;


    status.textContent =
        liveCount +
        " live · " +
        matches.length +
        " total";


    loading.style.display =
        "none";

}


/* ==================================================
   FIND MATCH
================================================== */

function findMatch(
    matches,
    id
) {

    return matches.find(
        function(match) {

            return String(
                match.match_id
            ) === String(id);

        }
    );

}


/* ==================================================
   SHOW PLAYER ERROR
================================================== */

function showPlayerMessage(message) {

    playerMessageText.textContent =
        message;

    playerMessage.style.display =
        "block";

}


/* ==================================================
   OPEN PLAYER
================================================== */

async function openPlayer(match) {

    home.style.display =
        "none";


    playerPage.style.display =
        "flex";


    playerTitle.textContent =
        match.title ||
        "CRICKCAST";


    playerMessage.style.display =
        "none";


    /*
        IMPORTANT:

        Extract URL from the
        object-based stream fields.
    */

    const streamUrl =
        getStreamUrl(match);


    console.log(
        "Match:",
        match.match_id
    );


    console.log(
        "Stream URL:",
        streamUrl
    );


    /*
        No URL
    */

    if (!streamUrl) {

        showPlayerMessage(
            "No playable stream URL is currently available for this match."
        );

        return;

    }


    /*
        Initialize Shaka
    */

    try {

        shaka.polyfill.installAll();


        if (
            !shaka.Player
                .isBrowserSupported()
        ) {

            throw new Error(
                "Browser not supported by Shaka Player."
            );

        }


        /*
            Destroy previous player
        */

        if (currentPlayer) {

            await currentPlayer.destroy();

            currentPlayer =
                null;

        }


        /*
            Create player
        */

        currentPlayer =
            new shaka.Player();


        await currentPlayer.attach(
            video
        );


        /*
            Basic playback configuration

            No DRM credentials are
            inserted here.
        */

        currentPlayer.configure({

            manifest: {

                retryParameters: {

                    maxAttempts: 5,

                    baseDelay: 500,

                    backoffFactor: 2,

                    fuzzFactor: .5,

                    timeout: 30000

                }

            },

            streaming: {

                lowLatencyMode:
                    false,

                bufferingGoal:
                    10,

                rebufferingGoal:
                    1.5,

                bufferBehind:
                    30,

                retryParameters: {

                    maxAttempts: 5,

                    baseDelay: 500,

                    backoffFactor: 2,

                    fuzzFactor: .5,

                    timeout: 30000

                }

            }

        });


        /*
            Load stream
        */

        await currentPlayer.load(
            streamUrl
        );


        /*
            Start playback
        */

        await video.play();


    }

    catch(error) {

        console.error(
            "Shaka playback error:",
            error
        );


        /*
            Show useful error
        */

        const message =
            error &&
            error.code
                ? "Shaka playback error: " +
                  error.code
                : "The stream could not be played.";


        showPlayerMessage(
            message
        );

    }

}


/* ==================================================
   CLOSE PLAYER
================================================== */

async function closePlayer() {

    if (currentPlayer) {

        try {

            await currentPlayer.destroy();

        }

        catch (_) {}

        currentPlayer =
            null;

    }


    video.pause();

    video.removeAttribute(
        "src"
    );

    video.load();


    playerPage.style.display =
        "none";


    home.style.display =
        "block";


    history.pushState(
        {},
        "",
        location.pathname
    );

}


/* ==================================================
   ROUTING
================================================== */

async function handleRoute() {

    try {

        const data =
            await loadData();


        const matches =
            Array.isArray(data.Matches)
                ? data.Matches
                : [];


        const params =
            new URLSearchParams(
                location.search
            );


        const id =
            params.get("id");


        /*
            HOME
        */

        if (!id) {

            renderMatches(
                data
            );

            return;

        }


        /*
            MATCH
        */

        const match =
            findMatch(
                matches,
                id
            );


        if (!match) {

            loading.style.display =
                "none";


            status.textContent =
                "Match not found.";


            return;

        }


        loading.style.display =
            "none";


        await openPlayer(
            match
        );

    }

    catch(error) {

        console.error(
            error
        );


        loading.style.display =
            "none";


        status.textContent =
            "Unable to load cricket data.";


        grid.innerHTML = `
            <div class="empty">
                Failed to load willow.json.
                <br><br>
                ${error.message}
            </div>
        `;

    }

}


/* ==================================================
   BACK BUTTON
================================================== */

back.addEventListener(
    "click",
    closePlayer
);


/* ==================================================
   BROWSER BACK
================================================== */

window.addEventListener(
    "popstate",
    handleRoute
);


/* ==================================================
   START
================================================== */

document.addEventListener(
    "DOMContentLoaded",
    handleRoute
);


/* ==================================================
   AUTO REFRESH
================================================== */

setInterval(
    async function() {

        if (!location.search) {

            try {

                const data =
                    await loadData();


                renderMatches(
                    data
                );

            }

            catch (_) {}

        }

    },
    5 * 60 * 1000
);

</script>

</body>
</html>
