```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRICKCAST · Live</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0b0b;
            color: #f1f1f1;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* HEADER */

        header {
            height: 72px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-bottom: 1px solid #1d1d1d;

            font-size: 22px;
            font-weight: 700;
        }

        /* MAIN */

        main {
            padding: 28px 22px 50px;
        }

        #status {
            text-align: center;

            color: #666;

            font-size: 13px;

            margin-bottom: 25px;
        }

        /* GRID */

        #matches {
            display: grid;

            grid-template-columns:
                repeat(5, minmax(0, 1fr));

            gap: 24px;
        }

        /* CARD */

        .match-card {
            background: #111;

            border: 1px solid #202020;

            border-radius: 16px;

            padding: 28px 18px 20px;

            min-height: 295px;

            display: flex;

            flex-direction: column;

            align-items: center;

            text-align: center;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .match-card:hover {
            transform: translateY(-3px);

            border-color: #333;

            background: #141414;
        }

        /* IMAGE */

        .match-image {
            width: 160px;
            height: 92px;

            object-fit: cover;

            border-radius: 7px;

            margin-bottom: 16px;

            background: #1a1a1a;
        }

        /* TITLE */

        .match-title {
            font-size: 18px;

            line-height: 1.35;

            font-weight: 600;

            margin-bottom: 15px;

            color: #eee;
        }

        /* TIME */

        .match-time {
            margin-top: auto;

            padding: 6px 13px;

            background: #202020;

            border-radius: 20px;

            font-size: 12px;

            color: #777;

            text-transform: uppercase;
        }

        /* LIVE */

        .live {
            color: #777;
        }

        /* PLAYER */

        #player {
            display: none;

            position: fixed;

            inset: 0;

            z-index: 9999;

            background: rgba(0, 0, 0, 0.95);

            align-items: center;

            justify-content: center;

            padding: 20px;
        }

        .player-box {
            width: min(1100px, 95vw);

            background: #111;

            border-radius: 12px;

            padding: 15px;

            position: relative;
        }

        video {
            width: 100%;

            max-height: 75vh;

            background: #000;

            border-radius: 8px;
        }

        .player-title {
            font-size: 18px;

            font-weight: 600;

            margin-top: 10px;
        }

        #close {
            position: absolute;

            right: 10px;
            top: 10px;

            width: 36px;
            height: 36px;

            border: 0;

            border-radius: 50%;

            background: #222;

            color: white;

            font-size: 22px;

            cursor: pointer;

            z-index: 2;
        }

        /* EMPTY */

        .empty {
            grid-column: 1 / -1;

            text-align: center;

            padding: 70px;

            color: #666;
        }

        /* RESPONSIVE */

        @media (max-width: 1400px) {
            #matches {
                grid-template-columns:
                    repeat(4, minmax(0, 1fr));
            }
        }

        @media (max-width: 1050px) {
            #matches {
                grid-template-columns:
                    repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 750px) {
            #matches {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 500px) {
            #matches {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    CRICKCAST · Live
</header>


<main>

    <div id="status">
        Loading matches...
    </div>

    <div id="matches"></div>

</main>


<!-- VIDEO PLAYER -->

<div id="player">

    <div class="player-box">

        <button id="close">
            ×
        </button>

        <video
            id="video"
            controls
            playsinline>
        </video>

        <div
            id="playerTitle"
            class="player-title">
        </div>

    </div>

</div>


<script>

/*
====================================================
GITHUB DATABASE
====================================================
*/

const WILLOW_JSON =
    "https://raw.githubusercontent.com/Vk1817/cricbuzz/main/willow.json";

const PRIME_JSON =
    "https://raw.githubusercontent.com/Vk1817/cricbuzz/main/primesport.json";


/*
====================================================
ELEMENTS
====================================================
*/

const matchesContainer =
    document.getElementById("matches");

const statusElement =
    document.getElementById("status");

const player =
    document.getElementById("player");

const video =
    document.getElementById("video");

const playerTitle =
    document.getElementById("playerTitle");

const closeButton =
    document.getElementById("close");


/*
====================================================
FETCH JSON
====================================================
*/

async function getJSON(url) {

    const response =
        await fetch(
            url + "?t=" + Date.now()
        );

    if (!response.ok) {
        throw new Error(
            "Unable to load database"
        );
    }

    return await response.json();
}


/*
====================================================
CREATE MATCH CARD
====================================================
*/

function createMatchCard(match) {

    const card =
        document.createElement("div");

    card.className =
        "match-card";


    /*
        IMAGE
    */

    const image =
        document.createElement("img");

    image.className =
        "match-image";

    image.src =
        match.cover_image;

    image.alt =
        match.title;

    image.loading =
        "lazy";

    card.appendChild(image);


    /*
        TITLE
    */

    const title =
        document.createElement("div");

    title.className =
        "match-title";

    title.textContent =
        match.title;

    card.appendChild(title);


    /*
        TIME
    */

    const time =
        document.createElement("div");

    time.className =
        "match-time";

    time.textContent =
        match.time || "LIVE";

    card.appendChild(time);


    /*
        CLICK
    */

    card.addEventListener(
        "click",
        () => {

            openMatch(match);

        }
    );


    return card;
}


/*
====================================================
OPEN MATCH
====================================================
*/

function openMatch(match) {

    /*
        For now display the event information.

        Actual stream playback will be connected
        after we map the Willow event to the
        corresponding PrimeSport stream.
    */

    playerTitle.textContent =
        match.title;


    /*
        If a direct stream exists in this
        match object, play it.
    */

    if (
        match.stream_url_alpha
    ) {

        video.src =
            match.stream_url_alpha;

        player.style.display =
            "flex";

        video.play()
            .catch(() => {});

        return;

    }


    /*
        No stream currently available.
    */

    alert(
        "This match does not have a live stream yet."
    );

}


/*
====================================================
CLOSE PLAYER
====================================================
*/

function closePlayer() {

    video.pause();

    video.removeAttribute(
        "src"
    );

    video.load();

    player.style.display =
        "none";

}


closeButton.addEventListener(
    "click",
    closePlayer
);


player.addEventListener(
    "click",
    event => {

        if (
            event.target === player
        ) {

            closePlayer();

        }

    }
);


/*
====================================================
LOAD WILLOW DATABASE
====================================================
*/

async function loadMatches() {

    try {

        statusElement.textContent =
            "Fetching latest cricket events...";


        /*
            Fetch Willow JSON
        */

        const willow =
            await getJSON(
                WILLOW_JSON
            );


        /*
            Get matches
        */

        const matches =
            willow.Matches || [];


        /*
            Clear old data
        */

        matchesContainer.innerHTML =
            "";


        /*
            No matches
        */

        if (
            matches.length === 0
        ) {

            matchesContainer.innerHTML = `
                <div class="empty">
                    No cricket events available.
                </div>
            `;

            statusElement.textContent =
                "No events found.";

            return;

        }


        /*
            Render cards
        */

        matches.forEach(
            match => {

                const card =
                    createMatchCard(
                        match
                    );

                matchesContainer.appendChild(
                    card
                );

            }
        );


        /*
            Status
        */

        statusElement.textContent =
            `${matches.length} cricket events available`;


    } catch (error) {

        console.error(
            error
        );

        statusElement.textContent =
            "Failed to load cricket events.";

        matchesContainer.innerHTML = `
            <div class="empty">
                Unable to load cricket data.
            </div>
        `;

    }

}


/*
====================================================
START
====================================================
*/

loadMatches();


/*
====================================================
AUTO REFRESH
====================================================

Your GitHub Actions updates the JSON files.

Refresh the webpage data every 5 minutes.
====================================================
*/

setInterval(
    loadMatches,
    5 * 60 * 1000
);

</script>

</body>
</html>
```
